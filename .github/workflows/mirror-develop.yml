name: Mirror LibreChat to B.Free

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-LibreChat-to-BFree:
    name: Mirror LibreChat to B.Free
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push LibreChat to B.Free (force mirror)
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          GH_PAT_FALLBACK: ${{ secrets.GH_PAT }}
          PAT_FALLBACK: ${{ secrets.PAT }}
          TARGET_REPO: PrabhashDiss/B.Free
          TARGET_BRANCH: mirror/develop
        shell: bash
        run: |
          set -euo pipefail

          # Resolve a usable PAT from available secrets
          GH_PAT="${MIRROR_PAT:-}"
          [[ -z "${GH_PAT}" ]] && GH_PAT="${GH_PAT_FALLBACK:-}"
          [[ -z "${GH_PAT}" ]] && GH_PAT="${PAT_FALLBACK:-}"

          if [[ -z "${GH_PAT:-}" ]]; then
            echo "Missing PAT. Create a Personal Access Token with 'repo' scope that has push access to ${TARGET_REPO} and add it as a repository secret named 'MIRROR_PAT' (or 'GH_PAT'/'PAT')." >&2
            exit 1
          fi

          if [[ -z "${TARGET_REPO:-}" ]]; then
            echo "TARGET_REPO not set (expected format: owner/repo)" >&2
            exit 1
          fi

          # Default target branch to 'mirror/<source-branch>' if not provided
          TARGET_BRANCH=${TARGET_BRANCH:-"mirror/${GITHUB_REF_NAME}"}

          # Clear any default auth header set by actions/checkout
          git config --global --unset-all http.https://github.com/.extraheader || true

          # Use x-access-token form and explicit PAT
          git remote add mirror "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git"

          # Preflight: verify PAT can access the target repo
          if ! git ls-remote --exit-code --heads mirror >/dev/null 2>&1; then
            echo "Authentication/authorization failed for ${TARGET_REPO}. Ensure the PAT has sufficient scopes and push access." >&2
            echo "Required: classic PAT with 'repo' scope, or fine-grained PAT with 'Contents: Read and write' for ${TARGET_REPO}." >&2
            exit 1
          fi

          # Ensure we have the local develop branch
          if ! git show-ref --verify --quiet refs/heads/develop; then
            echo "Local 'develop' branch not found" >&2
            exit 1
          fi

          # Create a temporary branch from develop to filter out workflows
          git checkout -B mirror-filter develop

          # Configure author for the commit
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Remove the workflows directory from the index (ignore if missing)
          git rm -r --cached --force --ignore-unmatch .github/workflows || true

          # Commit only if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "Mirror: exclude .github/workflows from mirror"
          fi

          # Force-update target branch to match the filtered snapshot
          git push --force mirror "refs/heads/mirror-filter:refs/heads/${TARGET_BRANCH}"

          # Clean up
          git checkout -f develop
          git branch -D mirror-filter || true

          # Optional: push tags alongside if you want them mirrored too (commented out by default)
          # git push --force --tags mirror
