name: Mirror LibreChat to B.Free

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-LibreChat-to-BFree:
    name: Mirror LibreChat to B.Free
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror via clone-copy-commit (exclude .git and .github/workflows)
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          GH_PAT_FALLBACK: ${{ secrets.GH_PAT }}
          PAT_FALLBACK: ${{ secrets.PAT }}
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REPO="PrabhashDiss/LibreChat"
          SOURCE_BRANCH="develop"
          TARGET_REPO="PrabhashDiss/B.Free"
          TARGET_BRANCH="mirror/develop"

          # Resolve a usable PAT from available secrets
          GH_PAT="${MIRROR_PAT:-}"
          [[ -z "${GH_PAT}" ]] && GH_PAT="${GH_PAT_FALLBACK:-}"
          [[ -z "${GH_PAT}" ]] && GH_PAT="${PAT_FALLBACK:-}"

          if [[ -z "${GH_PAT:-}" ]]; then
            echo "Missing PAT. Create a Personal Access Token with 'repo' scope that has push access to ${TARGET_REPO} and add it as a repository secret named 'MIRROR_PAT' (or 'GH_PAT'/'PAT')." >&2
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          SRC_DIR="${WORKDIR}/source"
          DST_DIR="${WORKDIR}/target"

          echo "Cloning source ${SOURCE_REPO}@${SOURCE_BRANCH}..."
          SOURCE_URL="https://github.com/${SOURCE_REPO}.git"
          git clone --no-tags --depth=1 --branch "${SOURCE_BRANCH}" "${SOURCE_URL}" "${SRC_DIR}"

          echo "Cloning target ${TARGET_REPO}@${TARGET_BRANCH}..."
          TARGET_URL="https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git"
          git clone --no-tags --depth=1 --branch "${TARGET_BRANCH}" "${TARGET_URL}" "${DST_DIR}"

          git -C "${DST_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${DST_DIR}" config user.name "github-actions[bot]"

          echo "Copying files from source to target (excluding .git and .github/workflows)..."
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            "${SRC_DIR}/" "${DST_DIR}/"

          git -C "${DST_DIR}" add -A
          if git -C "${DST_DIR}" diff --cached --quiet; then
            echo "No changes to commit; exiting."
            rm -rf "${WORKDIR}"
            exit 0
          fi

          git -C "${DST_DIR}" commit -m "Mirror from ${SOURCE_REPO}@${SOURCE_BRANCH} (exclude .git and .github/workflows)"
          git -C "${DST_DIR}" push origin "${TARGET_BRANCH}"

          rm -rf "${WORKDIR}"
