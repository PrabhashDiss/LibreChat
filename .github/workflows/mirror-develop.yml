name: Mirror LibreChat to B.Free

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-LibreChat-to-BFree:
    name: Mirror LibreChat to B.Free
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push LibreChat to B.Free (clone target, orphan commit, exclude workflows/.git)
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          GH_PAT_FALLBACK: ${{ secrets.GH_PAT }}
          PAT_FALLBACK: ${{ secrets.PAT }}
          TARGET_REPO: PrabhashDiss/B.Free
          TARGET_BRANCH: mirror/develop
        shell: bash
        run: |
          set -euo pipefail

          # Resolve a usable PAT from available secrets
          GH_PAT="${MIRROR_PAT:-}"
          [[ -z "${GH_PAT}" ]] && GH_PAT="${GH_PAT_FALLBACK:-}"
          [[ -z "${GH_PAT}" ]] && GH_PAT="${PAT_FALLBACK:-}"

          if [[ -z "${GH_PAT:-}" ]]; then
            echo "Missing PAT. Create a Personal Access Token with 'repo' scope that has push access to ${TARGET_REPO} and add it as a repository secret named 'MIRROR_PAT' (or 'GH_PAT'/'PAT')." >&2
            exit 1
          fi

          if [[ -z "${TARGET_REPO:-}" ]]; then
            echo "TARGET_REPO not set (expected format: owner/repo)" >&2
            exit 1
          fi

          # Default target branch to 'mirror/<source-branch>' if not provided
          TARGET_BRANCH=${TARGET_BRANCH:-"mirror/${GITHUB_REF_NAME}"}

          # Ensure we are mirroring the latest origin/develop
          git fetch --no-tags --depth=1 origin develop
          git checkout -B develop origin/develop

          # Build a filtered source snapshot excluding .git and workflows
          SRC_DIR="$(mktemp -d)"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            ./ "$SRC_DIR"/

          # Clone the target repo (shallow) and prepare an orphan commit
          TARGET_URL="https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git"
          TARGET_DIR="$(mktemp -d)"

          if ! git ls-remote --exit-code "$TARGET_URL" >/dev/null 2>&1; then
            echo "Authentication/authorization failed for ${TARGET_REPO}. Ensure the PAT has sufficient scopes and push access." >&2
            echo "Required: classic PAT with 'repo' scope, or fine-grained PAT with 'Contents: Read and write' for ${TARGET_REPO}." >&2
            exit 1
          fi

          git clone --no-tags --depth=1 "$TARGET_URL" "$TARGET_DIR"

          pushd "$TARGET_DIR" >/dev/null

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Create an orphan branch to ensure no history
          git checkout --orphan mirror-tmp

          # Remove all files except .git from working tree
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          # Copy filtered snapshot into target repo
          rsync -a --delete "$SRC_DIR"/ ./

          git add -A
          if git diff --cached --quiet; then
            echo "No files to commit after exclusions; aborting push." >&2
            exit 1
          fi

          git commit -m "Mirror snapshot from LibreChat develop (exclude .github/workflows; reset history)"

          # Rename orphan branch to target and force-push
          git branch -M "${TARGET_BRANCH}"
          git push --force origin "${TARGET_BRANCH}"

          popd >/dev/null

          # Clean up temp dirs
          rm -rf "$SRC_DIR" "$TARGET_DIR"
