name: Mirror LibreChat to B.Free

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-LibreChat-to-BFree:
    name: Mirror LibreChat to B.Free
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push LibreChat to B.Free (force mirror, no history, exclude workflows/.git)
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          GH_PAT_FALLBACK: ${{ secrets.GH_PAT }}
          PAT_FALLBACK: ${{ secrets.PAT }}
          TARGET_REPO: PrabhashDiss/B.Free
          TARGET_BRANCH: mirror/develop
        shell: bash
        run: |
          set -euo pipefail

          # Resolve a usable PAT from available secrets
          GH_PAT="${MIRROR_PAT:-}"
          [[ -z "${GH_PAT}" ]] && GH_PAT="${GH_PAT_FALLBACK:-}"
          [[ -z "${GH_PAT}" ]] && GH_PAT="${PAT_FALLBACK:-}"

          if [[ -z "${GH_PAT:-}" ]]; then
            echo "Missing PAT. Create a Personal Access Token with 'repo' scope that has push access to ${TARGET_REPO} and add it as a repository secret named 'MIRROR_PAT' (or 'GH_PAT'/'PAT')." >&2
            exit 1
          fi

          if [[ -z "${TARGET_REPO:-}" ]]; then
            echo "TARGET_REPO not set (expected format: owner/repo)" >&2
            exit 1
          fi

          # Default target branch to 'mirror/<source-branch>' if not provided
          TARGET_BRANCH=${TARGET_BRANCH:-"mirror/${GITHUB_REF_NAME}"}

          # Prepare remote and verify access
          git config --global --unset-all http.https://github.com/.extraheader || true
          git remote add mirror "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git"

          if ! git ls-remote --exit-code --heads mirror >/dev/null 2>&1; then
            echo "Authentication/authorization failed for ${TARGET_REPO}. Ensure the PAT has sufficient scopes and push access." >&2
            echo "Required: classic PAT with 'repo' scope, or fine-grained PAT with 'Contents: Read and write' for ${TARGET_REPO}." >&2
            exit 1
          fi

          # Ensure we are mirroring the latest origin/develop
          git fetch --no-tags --depth=1 origin develop
          git checkout -B develop origin/develop

          # Build a fresh orphan commit from develop, excluding .github/workflows and .git
          WORKDIR="$(mktemp -d)"

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            ./ "$WORKDIR"/

          pushd "$WORKDIR" >/dev/null

          git init -b mirror-root
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add -A
          if git diff --cached --quiet; then
            echo "No files to commit after exclusions; aborting push." >&2
            exit 1
          fi

          git commit -m "Mirror snapshot from develop (exclude .github/workflows, no history)"

          # Add remote and force-push as a new history (single commit)
          git remote add mirror "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git"
          git push --force mirror "HEAD:refs/heads/${TARGET_BRANCH}"

          popd >/dev/null
          rm -rf "$WORKDIR"

          # Optional: push tags alongside if you want them mirrored too (commented out by default)
          # (Not applicable for orphan snapshot)
